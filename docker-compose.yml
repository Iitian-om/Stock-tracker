services:
  api:
    build: .
    image: stock-tracker:1.0
    ports:
      - "80:8000"
    env_file: .env
    volumes:
      - ./data:/srv/data
    restart: unless-stopped

  worker:
    build: .
    image: stock-tracker:1.0
    command: ["python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - ./data:/srv/data
    depends_on:
      - api
    restart: unless-stopped
